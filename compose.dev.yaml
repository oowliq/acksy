# Dependencies for integration tests and local Postgres/Redis runs.
# Start with `make deps-up`; ports are offset to avoid clashing with local services.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: acksy
      POSTGRES_PASSWORD: acksy
      POSTGRES_DB: acksy
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acksy"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs: [/var/lib/postgresql]

  redis:
    image: redis:8-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
